name: Shivrai Tests

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/shivrai/**'
      - 'tests/shivrai/**'
      - '.github/workflows/shivrai-tests.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/shivrai/**'
      - 'tests/shivrai/**'

jobs:
  test:
    name: Build & Test Shivrai Modules
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++

    - name: Verify structure
      run: |
        echo "=== Repo structure ==="
        ls -la
        echo ""
        echo "=== Shivrai sources ==="
        find src/shivrai -name "*.cpp" | head -10
        echo ""
        echo "=== Test files ==="
        ls -la tests/shivrai/

    - name: Configure CMake
      working-directory: tests/shivrai
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

    - name: Build tests
      working-directory: tests/shivrai
      run: cmake --build build -j 4

    - name: Run all tests
      working-directory: tests/shivrai/build
      run: |
        FAILED=0
        TOTAL=0
        PASSED=0
        
        for t in test_identity test_interop test_rwa test_gaming test_payment test_concurrency test_monetary_policy; do
          echo ""
          echo "════════════════════════════════════════"
          echo "  Running $t"
          echo "════════════════════════════════════════"
          
          if ./$t; then
            PASSED=$((PASSED + 1))
          else
            FAILED=$((FAILED + 1))
          fi
          TOTAL=$((TOTAL + 1))
        done
        
        echo ""
        echo "════════════════════════════════════════"
        echo "  Summary: $PASSED/$TOTAL suites passed"
        echo "════════════════════════════════════════"
        
        if [ "$FAILED" -gt 0 ]; then
          echo "❌ $FAILED test suite(s) failed"
          exit 1
        fi
        
        echo "🎉 All test suites passed!"

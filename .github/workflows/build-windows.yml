name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-libevent
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-zeromq
          make
    - name: Configure
      shell: msys2 {0}
      run: cmake -B build -DENABLE_IPC=OFF -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
    - name: Build
      shell: msys2 {0}
      run: cmake --build build -j2 --target bitcoind bitcoin-cli
    - name: Copy DLLs
      shell: msys2 {0}
      run: |
        mkdir -p release
        cp build/bin/bitcoind.exe release/ || echo "bitcoind not found"
        cp build/bin/bitcoin-cli.exe release/ || echo "bitcoin-cli not found"
        ls build/bin/
        ldd build/bin/bitcoind.exe || echo "ldd failed"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: shivrai-hon-windows
        path: release/

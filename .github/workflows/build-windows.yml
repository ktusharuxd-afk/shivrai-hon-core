name: Build Windows
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Boost
      run: |
        choco install boost-msvc-14.3 -y
    - name: Configure
      run: |
        cmake -B build -DENABLE_IPC=OFF -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release -DBoost_ROOT="C:/local/boost_1_83_0"
    - name: Build
      run: |
        cmake --build build --config Release -j2 --target bitcoind bitcoin-cli
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: shivrai-hon-windows-exe
        path: |
          build/bin/Release/bitcoind.exe
          build/bin/Release/bitcoin-cli.exe

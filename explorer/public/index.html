<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIVRAI HON Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a00;color:#f5c518;font-family:Arial,sans-serif}
header{background:#2d1500;padding:20px;text-align:center;border-bottom:2px solid #f5c518}
header h1{font-size:2em}
header p{color:#ccc}
.stats{display:flex;gap:20px;padding:20px;flex-wrap:wrap;justify-content:center}
.card{background:#2d1500;border:1px solid #f5c518;border-radius:10px;padding:20px;min-width:200px;text-align:center}
.card h3{color:#ccc;font-size:0.9em;margin-bottom:10px}
.card p{font-size:1.8em;font-weight:bold}
.blocks{padding:20px}
.blocks h2{margin-bottom:15px}
.block{background:#2d1500;border:1px solid #333;border-radius:8px;padding:15px;margin-bottom:10px}
.block:hover{border-color:#f5c518}
.block-hash{font-size:0.75em;color:#aaa;word-break:break-all}
.block-info{display:flex;gap:20px;margin-top:8px;font-size:0.9em}
.badge{background:#f5c518;color:#000;padding:2px 8px;border-radius:4px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>SHIVRAI HON Explorer</h1>
<p>Decentralized Digital Currency of Bharat</p>
</header>
<div class="stats">
<div class="card"><h3>Total Blocks</h3><p id="blocks">-</p></div>
<div class="card"><h3>Difficulty</h3><p id="difficulty">-</p></div>
<div class="card"><h3>Chain</h3><p id="chain">-</p></div>
<div class="card"><h3>Block Reward</h3><p>200 HON</p></div>
</div>
<div class="blocks">
<h2>Latest Blocks</h2>
<div id="blockList">Loading...</div>
</div>
<script>
async function load(){
try{
const info=await fetch('/api/info').then(r=>r.json());
document.getElementById('blocks').textContent=info.blocks;
document.getElementById('difficulty').textContent=Number(info.difficulty).toFixed(4);
document.getElementById('chain').textContent=info.chain.toUpperCase();
}catch(e){console.error(e)}
try{
const blocks=await fetch('/api/latest').then(r=>r.json());
document.getElementById('blockList').innerHTML=blocks.map(b=>`
<div class="block">
<div style="display:flex;justify-content:space-between;align-items:center">
<span class="badge">Block ${b.height}</span>
<span style="color:#aaa;font-size:0.85em">${new Date(b.time*1000).toLocaleString()}</span>
</div>
<div class="block-hash">${b.hash}</div>
<div class="block-info"><span>Txns: ${b.nTx}</span><span>Size: ${b.size} bytes</span></div>
</div>`).join('');
}catch(e){document.getElementById('blockList').textContent='Error loading blocks';}
}
load();
setInterval(load,30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIVRAI HON Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f0600;color:#c4843a}
.hero{background:linear-gradient(180deg,rgba(255,153,0,0.12) 0%,transparent 100%);padding:2rem;text-align:center;border-bottom:1px solid rgba(255,153,0,0.2)}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.logo-icon{width:42px;height:42px;background:#FF9900;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo-text{font-size:24px;font-weight:600;color:#FF9900}
.tagline{font-size:12px;color:#8a5a20;letter-spacing:2px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,153,0,0.08);border-bottom:1px solid rgba(255,153,0,0.12)}
.stat{padding:1.25rem;text-align:center;background:#0f0600}
.stat-label{font-size:11px;color:#6a4020;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:500;color:#FF9900}
.stat-sub{font-size:11px;color:#4a2a08;margin-top:3px}
.section{padding:1.5rem;max-width:900px;margin:0 auto}
.section-title{font-size:12px;font-weight:500;color:#8a5a20;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(255,153,0,0.12)}
.search-bar{display:flex;gap:8px;margin-bottom:1.5rem}
.search-input{flex:1;background:rgba(255,153,0,0.04);border:0.5px solid rgba(255,153,0,0.2);border-radius:8px;padding:10px 14px;color:#c4843a;font-size:13px;outline:none;font-family:'Inter',sans-serif}
.search-input::placeholder{color:#3a1a04}
.search-btn{background:rgba(255,153,0,0.12);border:0.5px solid rgba(255,153,0,0.3);border-radius:8px;padding:10px 20px;color:#FF9900;font-size:13px;cursor:pointer}
.block-card{background:rgba(255,153,0,0.04);border:0.5px solid rgba(255,153,0,0.12);border-radius:8px;padding:1rem;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.block-card:hover{border-color:rgba(255,153,0,0.35);background:rgba(255,153,0,0.07)}
.block-num{background:rgba(255,153,0,0.12);border:0.5px solid rgba(255,153,0,0.25);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:500;color:#FF9900;white-space:nowrap}
.block-hash{font-family:monospace;font-size:11px;color:#5a3a10;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-info{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:10px;color:#7a5020;background:rgba(255,153,0,0.07);padding:2px 7px;border-radius:4px}
.reward{font-size:13px;font-weight:500;color:#FF9900;white-space:nowrap}
.block-time{font-size:11px;color:#4a2a08;text-align:right;margin-top:2px}
.live-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:6px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.net-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.net-item{background:rgba(255,153,0,0.03);border:0.5px solid rgba(255,153,0,0.1);border-radius:6px;padding:10px 14px;display:flex;justify-content:space-between}
.net-label{font-size:12px;color:#5a3a10}
.net-value{font-size:12px;font-weight:500;color:#c4843a}
.error{color:#e24b4a;font-size:12px;padding:1rem;text-align:center}
.loading{color:#5a3a10;font-size:12px;padding:2rem;text-align:center}
</style>
</head>
<body>
<div class="hero">
  <div class="logo">
    <div class="logo-icon">&#x1F6E1;</div>
    <span class="logo-text">SHIVRAI HON Explorer</span>
  </div>
  <div class="tagline">Decentralized Digital Currency of Bharat</div>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">Total Blocks</div><div class="stat-value" id="s-blocks">—</div><div class="stat-sub">mined</div></div>
  <div class="stat"><div class="stat-label">Block Reward</div><div class="stat-value">200</div><div class="stat-sub">HON per block</div></div>
  <div class="stat"><div class="stat-label">Halving</div><div class="stat-value">2 yr</div><div class="stat-sub">210,240 blocks</div></div>
  <div class="stat"><div class="stat-label">Network</div><div class="stat-value" id="s-chain">—</div><div class="stat-sub">chain</div></div>
</div>
<div class="section">
  <div class="search-bar">
    <input class="search-input" id="search-inp" placeholder="Search block height or hash..." />
    <button class="search-btn" onclick="doSearch()">Search</button>
  </div>
  <div class="section-title"><span class="live-dot"></span>Latest Blocks</div>
  <div id="block-list"><div class="loading">Loading blocks...</div></div>
  <div class="section-title" style="margin-top:1.5rem">Network Info</div>
  <div class="net-grid">
    <div class="net-item"><span class="net-label">Block Time</span><span class="net-value">5 minutes</span></div>
    <div class="net-item"><span class="net-label">P2P Port</span><span class="net-value">8444</span></div>
    <div class="net-item"><span class="net-label">Max Supply</span><span class="net-value">40,000,000 HON</span></div>
    <div class="net-item"><span class="net-label">Algorithm</span><span class="net-value">SHA-256</span></div>
  </div>
</div>
<script>
async function load(){
  try{
    const info=await fetch('/api/info').then(r=>r.json());
    document.getElementById('s-blocks').textContent=info.blocks??'—';
    document.getElementById('s-chain').textContent=(info.chain||'—').toUpperCase();
  }catch(e){}
  try{
    const blocks=await fetch('/api/latest').then(r=>r.json());
    if(!Array.isArray(blocks)||blocks.length===0){
      document.getElementById('block-list').innerHTML='<div class="loading">No blocks yet</div>';
      return;
    }
    document.getElementById('block-list').innerHTML=blocks.map(b=>`
    <div class="block-card">
      <div class="block-num">#${b.height}</div>
      <div>
        <div class="block-hash">${b.hash}</div>
        <div class="block-info">
          <span class="badge">${b.nTx} txn</span>
          <span class="badge">${b.size} bytes</span>
          <span class="badge">${new Date(b.time*1000).toLocaleTimeString()}</span>
        </div>
      </div>
      <div>
        <div class="reward">200 HON</div>
        <div class="block-time">${new Date(b.time*1000).toLocaleDateString()}</div>
      </div>
    </div>`).join('');
  }catch(e){
    document.getElementById('block-list').innerHTML='<div class="error">Node connecting...</div>';
  }
}
function doSearch(){
  const v=document.getElementById('search-inp').value.trim();
  if(v) alert('Search: '+v);
}
load();
setInterval(load,30000);
</script>
</body>
</html>
